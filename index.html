<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aziz Retina &amp; Healthcare Center – HMIS</title>
<style>
:root{--bg:#e8f1f2;--bg2:#d4e6e8;--card:rgba(255,255,255,.62);--bd:rgba(255,255,255,.8);--tx:#12303a;--mu:#5b7a83;--ac:#0b7a75;--ac2:#14a39b;--dn:#c8453b;--wn:#d99a1e;--ok:#2a9d5c;--sh:8px 8px 20px rgba(11,70,80,.14),-6px -6px 16px rgba(255,255,255,.85)}
:root[data-t=dark]{--bg:#0e1b20;--bg2:#13262d;--card:rgba(28,48,56,.62);--bd:rgba(255,255,255,.09);--tx:#e3f1f2;--mu:#8fb0b6;--ac:#2fc4b8;--ac2:#1d8f86;--sh:8px 8px 20px rgba(0,0,0,.45),-4px -4px 14px rgba(60,100,110,.12)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--ff,Segoe UI,system-ui,Roboto,sans-serif);color:var(--tx);background:linear-gradient(135deg,var(--bg),var(--bg2));padding-top:env(safe-area-inset-top);font-size:var(--fs,15px)}
.urdu{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif}
#app{display:flex;min-height:100%}
aside{width:var(--sw,230px);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);backdrop-filter:blur(16px);border-right:1px solid var(--bd);flex-shrink:0;z-index:30;transition:.25s}
aside .brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
aside .brand img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff}
aside .brand b{font-size:13px;line-height:1.2}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:4px;color:var(--tx);font-weight:500}
.nv:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.nv.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 16px rgba(11,122,117,.4)}
main{flex:1;min-width:0;padding:18px;padding-bottom:40px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:22px;flex:1}
#burger{display:none}
.card{background:var(--card);backdrop-filter:blur(var(--bl,14px));border:1px solid var(--bd);border-radius:var(--r,18px);box-shadow:var(--sh);padding:16px;margin-bottom:16px;transition:.2s}
.card:hover{transform:translateY(-2px)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:26px;color:var(--ac)}
.stat span{color:var(--mu);font-size:13px}
button,.btn{font:inherit;border-radius:var(--rb,12px);padding:9px 14px;cursor:pointer;background:var(--card);color:var(--tx);box-shadow:var(--sh);transition:.15s;border:1px solid var(--bd)}
button:hover{transform:translateY(-2px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.d{background:var(--dn);color:#fff;border:0}
.sm{padding:5px 9px;font-size:12.5px;border-radius:9px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:var(--rb,11px);border:1px solid var(--bd);background:rgba(255,255,255,.5);color:var(--tx);box-shadow:inset 3px 3px 7px rgba(11,70,80,.1),inset -3px -3px 7px rgba(255,255,255,.5)}
:root[data-t=dark] input,:root[data-t=dark] select,:root[data-t=dark] textarea{background:rgba(0,0,0,.25);box-shadow:inset 2px 2px 6px rgba(0,0,0,.4)}
label{font-size:12.5px;color:var(--mu);display:block;margin:8px 0 3px}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ck{display:flex;flex-wrap:wrap;gap:8px}
.ck label{display:flex;align-items:center;gap:5px;margin:0;color:var(--tx);background:var(--card);padding:5px 10px;border-radius:20px;border:1px solid var(--bd);cursor:pointer}
.ck input{width:auto;box-shadow:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:600;padding:8px;white-space:nowrap}
td{padding:8px;border-top:1px solid var(--bd);vertical-align:middle}
.tg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--bg2);margin:1px;color:var(--tx)}
.tg.r{background:#f9d6d2;color:#8a2119}.tg.g{background:#cdeedb;color:#16603a}.tg.y{background:#fbe8b8;color:#6d4b05}.tg.b{background:#cfe4f7;color:#124a7c}
.mo{position:fixed;inset:0;background:rgba(5,25,30,.55);backdrop-filter:blur(4px);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.mo.on{display:flex}
.mb{background:var(--bg);border-radius:20px;padding:18px;width:100%;max-width:820px;box-shadow:var(--sh);border:1px solid var(--bd);margin:auto}
.mb h2{margin-bottom:8px;font-size:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--bg2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:30px;z-index:400;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bars div{flex:1;background:linear-gradient(var(--ac2),var(--ac));border-radius:8px 8px 0 0;min-height:3px;position:relative}
.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
#pa{display:none}
.slip{width:190mm;font-family:Arial,sans-serif;color:#000;font-size:var(--sfs,12px)}
.slip .h{text-align:center;border-bottom:2px solid #0b7a75;padding-bottom:6px;margin-bottom:8px}
.slip .h img{height:50px}.slip .h h2{font-size:20px;color:#0b7a75}
.slip table td,.slip table th{border:1px solid #999;padding:4px 6px;color:#000}
.slip .bx{border:1px solid #999;padding:6px;margin:6px 0;min-height:30px}
@media(max-width:820px){
 aside{position:fixed;left:-250px;top:0;width:240px;box-shadow:var(--sh)}
 aside.on{left:0}
 #burger{display:inline-block}
 main{padding:12px}
 .top h1{font-size:18px}
 .mo{padding:6px}.mb{padding:12px}
 .pt th:nth-child(5),.pt td:nth-child(5),.pt th:nth-child(1),.pt td:nth-child(1),.pt th:nth-child(4),.pt td:nth-child(4),.pt th:nth-child(6),.pt td:nth-child(6),.pt th:nth-child(7),.pt td:nth-child(7),.pt th:nth-child(8),.pt td:nth-child(8){display:none}
 .pt td:last-child{white-space:normal!important}
 .pt td:last-child .sm{margin:2px 2px 2px 0}
}
@media print{
 @page{size:A4;margin:10mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}
 #app,.mo,#toast{display:none!important}
 #pa{display:block!important}
 .slip{width:100%}
 .pg+.pg{page-break-before:always}
@media(max-width:820px){#rp{top:auto!important;bottom:76px;left:12px;right:12px!important;width:auto!important}}
.pg+.pg{break-before:page}
}
.slip .fm{width:100%;border-collapse:collapse;margin:3px 0}
.slip .fm td{border:1px solid #000;padding:3px 5px;font-size:11.5px;vertical-align:middle;color:#000}
.slip .fm td.l{font-weight:600}
.slip .pg{margin-bottom:20px}
.slip .cl{border:1px solid #000;padding:5px 9px;font-size:12.5px;line-height:2;direction:rtl;text-align:right;margin-top:-1px}
.slip .ur,.slip .ur td,.slip .cl{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
.cs{display:grid;gap:14px;grid-template-columns:minmax(260px,320px) 1fr;align-items:start}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.cg small{color:var(--mu)}
.cd{padding:8px 0;border-radius:10px;font-size:13px;box-shadow:none}
.cd.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.cd.td{outline:2px solid var(--ac)}
.cd sup{font-size:9px;margin-left:1px;color:var(--ac)}.cd.on sup{color:#fff}
@media(max-width:820px){.cs{grid-template-columns:1fr}}
.slip .fm.s td{font-size:10px;padding:2px 4px}
.pg+.pg{page-break-before:always}
.slip table.nb td,.slip table.nb th{border:0!important}
.cz-right #app{flex-direction:row-reverse}.cz-right aside{border-right:0;border-left:1px solid var(--bd)}
.cz-compact .card{padding:10px;margin-bottom:10px}.cz-compact td,.cz-compact th{padding:4px 6px}.cz-compact button{padding:6px 10px}
.cz-solid .card{backdrop-filter:none;background:var(--bg2)}.cz-flat .card{box-shadow:none}
.hd-clock .dw-clock,.hd-stats .dw-stats,.hd-chart .dw-chart,.hd-low .dw-low,.hd-audit .dw-audit{display:none}
@media(max-width:820px){.cz-right aside{left:auto;right:-250px}.cz-right aside.on{right:0}}
.pt2 td:last-child{white-space:normal!important}.pt2 td:last-child .sm{margin:2px 2px 2px 0}
</style>
</head>
<body>
<div id="app">
 <aside id="sd"></aside>
 <main>
  <div class="top">
   <button id="burger" aria-label="Menu" onclick="event.stopPropagation();sd.classList.toggle('on')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
   <h1 id="ttl"></h1>
   <select id="role" style="width:auto" onchange="setRole(this.value)"><option>Admin</option><option>Doctor</option><option>Receptionist</option><option>Pharmacist</option><option>Lab Tech</option></select>
   <span id="cl" class="tg" style="display:none"></span><span id="b2c" class="tg" style="display:none;cursor:pointer" title="Cloud status (click for details)" onclick="nav('set')"></span><span id="who" class="tg" style="display:none"></span><button id="lo" style="display:none" onclick="myAcct()">Account</button><button onclick="toggleLang()">اردو/EN</button>
   <button id="thBtn" title="Light / dark mode" aria-label="Light / dark mode" onclick="toggleTheme()"></button>
  </div>
  <div id="view"></div>
 </main>
</div>
<div class="mo" id="mo"><div class="mb" id="mb"></div></div>
<div id="pa"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const K='clinic_hmis_v1';
const defDB=()=>({patients:[],appts:[],visits:[],bills:[],meds:[],ipd:[],sforms:[],tokens:[],surg:[],pdocs:[],dslips:[],users:[],rem:[],expenses:[],audit:[],
 set:{name:'Aziz Retina & Health Care Center',doc:'Dr. Nadeem Ahmad',qual:'MBBS, DOMS, FCPS & Fellowship in Vitreo Retina',addr:'Ghous-e-Azam Road near Chungi #1 Multan',phone:'03006304234',logo:'',mrn:60202578,fee:1000,tokMode:'daily',tokV2:1},
 last:0,role:'Admin',theme:'light',lang:'en',ui:null});
let DB;
try{DB=JSON.parse(localStorage.getItem(K))||defDB()}catch(e){DB=defDB()}
DB.ipd=DB.ipd||[];DB.sforms=DB.sforms||[];DB.tokens=DB.tokens||[];DB.surg=DB.surg||[];DB.pdocs=DB.pdocs||[];DB.dslips=DB.dslips||[];if(!DB.set.tokV2){DB.set.tokMode='daily';DB.set.tokV2=1}if(!DB.set.testsV){DB.set.tests='';DB.set.testsV=2}
const save=()=>{stamp();try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Storage is full. Remove some attachments.')}if(CL.ready)pushSoon();if(B2.on&&B2.ready)b2Soon()};
const log=a=>{DB.audit.unshift({t:new Date().toISOString(),role:DB.role,user:ME?ME.name:'',a});DB.audit=DB.audit.slice(0,300)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dstr=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dstr(Date.now());
const fmt=n=>(CZ().cur||'Rs')+' '+(+n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',Math.max(2600,m.length*55))};
const pat=id=>DB.patients.find(p=>p.id===id)||{};

/* ---------- navigation ---------- */
const NAV=[['dash','🏠','Dashboard','ڈیش بورڈ',['Admin','Doctor','Receptionist','Pharmacist','Lab Tech']],
['pat','👤','Patients','مریض',['Admin','Doctor','Receptionist']],
['sg','🗓','Surgery Booking','سرجری بکنگ',['Admin','Doctor','Receptionist']],
['emr','🩺','Consultations','معائنہ',['Admin','Doctor']],
['ipd','🛏','IPD Admissions','داخلہ',['Admin','Doctor','Receptionist']],
['ds','📄','Discharge Slips','ڈسچارج سلپ',['Admin','Doctor','Receptionist']],
['sf','📋','Surgery Forms','سرجری فارم',['Admin','Doctor','Receptionist']],
['rem','🔔','Reminders','یاد دہانی',['Admin','Doctor','Receptionist','Pharmacist','Lab Tech']],
['bill','💳','Billing','بلنگ',['Admin','Receptionist']],
['pharm','💊','Pharmacy','فارمیسی',['Admin','Pharmacist']],
['rep','📊','Reports & Export','رپورٹس',['Admin','Doctor','Receptionist']],
['set','⚙️','Settings & Backup','سیٹنگز',['Admin']]];
let cur='dash',q='';
function nav(v){cur=v;q='';sd.classList.remove('on');render()}
function setRole(r){DB.role=r;save();render()}
function toggleTheme(){DB.theme=DB.theme=='dark'?'light':'dark';save();applyT()}
function toggleLang(){DB.lang=DB.lang=='en'?'ur':'en';save();render()}
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeIcon(){const b=$('#thBtn');if(b)b.innerHTML=DB.theme=='dark'?SUN:MOON}
document.querySelector('main').addEventListener('click',()=>{if(sd.classList.contains('on'))sd.classList.remove('on')});
function applyT(){document.documentElement.dataset.t=DB.theme;applyUI();themeIcon()}
const ur=()=>DB.lang=='ur';

function render(){
 applyT();document.body.classList.toggle('urdu',ur());
 if(loginOn()&&!ME){$('#view').innerHTML='';sd.innerHTML='';showLogin();return}hideLogin();
 $('#role').value=DB.role;const lo=loginOn()&&ME;$('#role').style.display=loginOn()?'none':'';$('#who').style.display=lo?'':'none';$('#lo').style.display=lo?'':'none';if(lo)$('#who').textContent=ME.name+' ('+ME.role+')';
 const s=DB.set,c=CZ(),nl=navList().filter(n=>n.show&&n.roles.includes(DB.role));if(!nl.find(n=>n.id==cur))cur=nl[0]?nl[0].id:'dash';
 sd.innerHTML=`<div class="brand">${s.logo?`<img src="${s.logo}">`:''}<b>${esc(s.name)}</b></div>`+nl.map(n=>`<div class="nv ${cur==n.id?'on':''}" onclick="nav('${n.id}')">${c.icons?`<span>${esc(n.icon)}</span>`:''}${ur()?esc(n.ur):esc(n.label)}</div>`).join('');
 const n=nl.find(x=>x.id==cur);$('#ttl').textContent=n?(ur()?n.ur:n.label):'';
 $('#view').innerHTML=V[cur]();tickClk();
}

/* ---------- modal ---------- */
function openM(h){$('#mb').innerHTML=h;$('#mo').classList.add('on');try{if(!_mh){history.pushState({m:1},'');_mh=1}}catch(e){}if(window._dkp){const k=window._dkp;window._dkp=null;draftStart(k[0],k[1])}else window._dk=null}
function closeM(){window._cz=0;stopCam();$('#mo').classList.remove('on');window._dk=null;if(loginOn()&&!ME)render()}
$('#mo').addEventListener('mousedown',e=>{if(e.target.id=='mo'&&!window._dk)closeM()});

/* ---------- views ---------- */
const V={};
V.dash=()=>{
 const t=today(),vt=DB.bills.filter(b=>b.date==t);
 const rev=vt.reduce((a,b)=>a+b.paid,0),due=DB.bills.reduce((a,b)=>a+(b.total-b.paid),0);
 const days=[...Array(7)].map((_,i)=>{const d=dstr(Date.now()-(6-i)*864e5);return[d.slice(5),DB.bills.filter(b=>b.date==d).reduce((a,b)=>a+b.paid,0)]});
 const mx=Math.max(1,...days.map(d=>d[1]));
 const low=DB.meds.filter(m=>m.qty<=m.min),exp=DB.meds.filter(m=>m.exp&&(new Date(m.exp)-Date.now())/864e5<60);
 const days3=!CL.user&&!B2.on&&(Date.now()-DB.last)/864e5>3;
 return clockCard()+(ME&&ME.def?`<div class="card" style="border-color:var(--wn)">Security: this account still uses the default password. <button class="sm p" onclick="myAcct()">Change password</button></div>`:'')+`${days3?`<div class="card" style="border-color:var(--wn)">⚠️ ${DB.last?'More than 3 days have passed since your last backup.':'No backup has been taken yet.'} <button class="sm p" onclick="backup()">Download backup</button></div>`:''}
 <div class="grid dw-stats">
 <div class="card stat"><b>${DB.patients.length}</b><span>Total patients</span></div>
 <div class="card stat"><b>${DB.tokens.filter(k=>k.date==t).length}</b><span>Tokens today</span></div>
 <div class="card stat"><b>${DB.surg.filter(g=>g.date==t&&g.status=='Booked').length}</b><span>Surgeries today</span></div>
 <div class="card stat"><b>${DB.patients.filter(p=>p.created==t).length}</b><span>New patients today</span></div>
 <div class="card stat"><b>${DB.ipd.filter(a=>a.status=='Admitted').length}</b><span>Admitted now</span></div>
 <div class="card stat"><b>${fmt(rev)}</b><span>Today's collection</span></div>
 <div class="card stat"><b>${fmt(due)}</b><span>Total dues</span></div></div>
 <div class="card dw-chart"><b>Revenue – last 7 days</b><div class="bars" style="margin:14px 0 24px">${days.map(d=>`<div style="height:${d[1]/mx*100}%"><small>${d[0]}</small></div>`).join('')}</div></div>
 <div class="grid dw-low" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
 <div class="card"><b>Low stock</b><br>${low.map(m=>`<span class="tg r">${esc(m.name)} (${m.qty})</span>`).join('')||'<small>All stock levels are fine</small>'}</div>
 <div class="card"><b>Expiring within 60 days</b><br>${exp.map(m=>`<span class="tg y">${esc(m.name)} ${m.exp}</span>`).join('')||'<small>None</small>'}</div></div>
 <div class="card dw-audit"><b>Audit log (latest)</b><div class="tw"><table>${DB.audit.slice(0,8).map(a=>`<tr><td>${new Date(a.t).toLocaleString()}</td><td>${esc(a.user||a.role)}</td><td>${esc(a.a)}</td></tr>`).join('')}</table></div></div>`;
};

const normC=s=>String(s||'').replace(/\D/g,'');
const pMatch=(p,s)=>{s=String(s).toLowerCase().trim();const dg=normC(s);return [p.name,p.mrn,p.phone,p.cnic,p.gname].join(' ').toLowerCase().includes(s)||(dg.length>=4&&[p.phone,p.cnic,p.mrn].some(x=>normC(x).includes(dg)))};
const pOpts=(f,sel)=>DB.patients.filter(p=>!p.arch&&(!f||pMatch(p,f))).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${p.mrn} – ${esc(p.name)} · ${esc(p.phone)}</option>`).join('');
const psel=(id,sel)=>`<input placeholder="🔍 Search patient by name, MRN, CNIC or phone" oninput="$('#${id}').innerHTML=pOpts(this.value,'${sel||''}')" style="margin-bottom:6px"><select id="${id}">${pOpts('',sel)}</select>`;
const prefill=s=>{const d=normC(s);if(d.length==13)return{cnic:s};if(d.length==11&&d[0]=='0')return{phone:d};return/[a-z]/i.test(s)?{name:s}:{}};
const lastTk=pid=>DB.tokens.filter(t=>t.pid==pid).sort((a,b)=>b.ts-a.ts)[0];
function V_s(){const p=$('#sq').selectionStart;$('#view').innerHTML=V.pat();const e=$('#sq');e.focus();e.setSelectionRange(p,p)}

let camStream=null,tmpPhoto='',tmpDocs=[];
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
const CH=['DM','HTN','CKD','Asthma','IHD','Hep B/C','HIV'];
function patForm(id){
 const p=DB.patients.find(x=>x.id==id)||Object.assign({chronic:[],gender:'Male',tag:'Regular'},window._pre||{});window._pre=null;
 tmpPhoto=p.photo||'';tmpDocs=p.docs||[];
 openMD('pat:'+(id||'new'),{get:()=>({p:tmpPhoto}),set:x=>{tmpPhoto=x.p||'';if(tmpPhoto){const v=$('#pv');v.src=tmpPhoto;v.style.display='block'}}},`<h2>${id?'Edit':'New'} Patient ${id?p.mrn:''}</h2>
 <div id="dupbox"></div><div class="f">${id?`<div><label>MRN (permanent, cannot be changed)</label><input value="${p.mrn}" readonly></div>`:''}<div><label>Name *</label><input id="n" value="${esc(p.name)}"></div>

 catch(e){const r=Object.values(sheets)[0]||[],h=Object.keys(r[0]||{});

  dlBlob(new Blob([csv],{type:'text/csv'}),name+'.csv');toast('Excel library could not load (offline?). Downloaded a CSV instead; it opens in Excel.')}}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('clinic_fs',2);r.onupgradeneeded=()=>{const d=r.result;['h','files'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const hGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
const hSet=async(k,v)=>{try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(v,k)}catch(e){}};
const JT=[{description:'Clinic backup (JSON)',accept:{'application/json':['.json']}}];
async function backup(){const txt=JSON.stringify(await dbFull());
 if(window.showSaveFilePicker){try{const last=await hGet('last'),o={suggestedName:(last&&last.name)||'CLINIC-BACKUP.json',types:JT};if(last)o.startIn=last;
   const h=await showSaveFilePicker(o),w=await h.createWritable();await w.write(txt);await w.close();await hSet('last',h);DB.last=Date.now();save();toast('Backup saved: '+h.name);render();return}
  catch(e){if(e.name=='AbortError')return}}
 dlBlob(new Blob([txt],{type:'application/json'}),'CLINIC-BACKUP.json');DB.last=Date.now();save();toast('Backup downloaded (this browser cannot choose a file; it saves to Downloads)');render()}
async function restoreFile(){
 if(window.showOpenFilePicker){try{const last=await hGet('last'),o={types:JT};if(last)o.startIn=last;const[h]=await showOpenFilePicker(o);await hSet('last',h);applyRestore(await(await h.getFile()).text());return}catch(e){if(e.name=='AbortError')return}}
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(f)f.text().then(applyRestore)};i.click()}
async function applyRestore(t){try{const d=JSON.parse(t);if(!d.patients||!d.set)throw 0;if(!confirm('Current data on this device will be replaced by the backup. Continue?'))return;
 const F=d._files||{};delete d._files;for(const k in F)await fSet(k,F[k]);
 DB=Object.assign(defDB(),d);['ipd','sforms','tokens','surg','pdocs','dslips','users','rem'].forEach(k=>DB[k]=DB[k]||[]);DB.set.id='main';ensureAdmin().then(()=>{ME=null;try{sessionStorage.removeItem('clinic_u')}catch(e){}save();render();toast('Restore complete ✔')})}catch(e){toast('This is not a valid backup file')}}

 <td style="white-space:nowrap"><button class="sm" onclick="admSlip('${a.id}')">Admission slip</button> <button class="sm" onclick="ipdNotes('${a.id}')">Notes</button> ${d?`<button class="sm p" onclick="disSlip('${a.id}')">Discharge slip</button>`:`<button class="sm d" onclick="disForm('${a.id}')">Discharge</button>`}</td></tr>`};

 const ap=$('#ia_ap').value.trim();if(ap&&!/^03\d{9}$/.test(ap))return toast('Attendant phone must be 11 digits (03XXXXXXXXX)');
 if(DB.ipd.some(a=>a.pid==pid&&a.status=='Admitted'))return toast('This patient is already admitted');
 const a={id:uid(),no:'ADM-'+String(DB.ipd.length+1).padStart(5,'0'),pid,adm:$('#ia_t').value,ward:$('#ia_w').value,bed:$('#ia_b').value,doc:$('#ia_d').value,an:$('#ia_an').value,ap,dx:x,reason:$('#ia_r').value,status:'Admitted',notes:[],rate:+($('#ia_c').value)||WRATE[$('#ia_w').value]};
 if($('#ia_ck').checked){const f=+$('#ia_f').value||0,adv=+$('#ia_ad').value||0;a.charged=true;a.rate=+$('#ia_c').value||0;
  if(f>0||adv>0){const b={id:uid(),no:'B-'+String(DB.bills.length+1).padStart(5,'0'),pid,date:today(),items:[['Admission fee ('+a.no+')',f]],disc:0,total:f,paid:Math.min(adv,f)||adv,method:$('#ia_m').value,comm:0,ipd:a.id};
   if(adv>f){b.items.push(['Advance deposit',adv-f]);b.total=adv}b.paid=adv;DB.bills.push(b);a.billId=b.id}}

 if($('#id_ck').checked){const days=+$('#id_d').value||1,r=+$('#id_r').value||0,add=[['Room charges ('+a.ward+') × '+days+' day(s)',r*days],['Procedure / surgeon fee',+$('#id_pf').value||0],['Pharmacy / consumables',+$('#id_ph').value||0],['Other charges',+$('#id_o').value||0]].filter(i=>i[1]>0);

 <details open style="margin-top:10px"><summary><b>One-time bucket setup (CORS)</b></summary><ol style="margin:8px 0 0 18px;line-height:1.7"><li>Backblaze → <b>Buckets</b> → your bucket → <b>CORS Rules</b>.</li><li>Choose <b>Custom</b> / edit the rules as JSON, <b>delete any old rule</b>, paste the rule below and save. (The simple "share everything" option only allows downloads, so it is not enough.)</li><li>Keep the bucket <b>Private</b>.</li><li>Open this app in <b>Chrome</b> from the saved file or from your own link (not inside the Claude preview).</li><li>Press <b>Save & connect</b> again.</li></ol>

 <p style="color:var(--mu);font-size:13px;margin-top:8px">On another PC or phone: Settings → Paste connection code. Documents (photos, PDFs) are stored in the same bucket.</p></details>
